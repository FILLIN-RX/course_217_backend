    <script type="module">
    // Configuration
    const API_URL = "http://localhost:4000";

    async function loadUserProfile() {
        const token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = 'teacher-login.html';
            return;
        }

        try {
            const response = await fetch(`${API_URL}/auth/profile`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const userData = await response.json();
                
                // 1. Mise à jour du nom
                document.getElementById('profile-name').textContent = userData.nom;
                
                // 2. Création des initiales (ex: "John Doe" -> "JD")
                const initials = userData.nom
                    .split(' ')
                    .map(word => word[0])
                    .join('')
                    .toUpperCase()
                    .substring(0, 2);
                document.getElementById('user-avatar').textContent = initials;

                // 3. Optionnel : Afficher le rôle ou département
                document.getElementById('profile-dept').textContent = userData.role === 'ENSEIGNANT' ? 'Enseignant' : 'Administrateur';
                
                // Charger l'emploi du temps après avoir validé le profil
                loadTeacherSchedule(token);
                
            } else {
                // Si le token est invalide ou expiré
                localStorage.clear();
                window.location.href = 'teacher-login.html';
            }
        } catch (error) {
            console.error("Erreur de profil:", error);
        }
    }

    async function loadTeacherSchedule(token) {
        try {
            const res = await fetch(`${API_URL}/enseignant/emplois-du-temps/detail`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const schedule = await res.json();
            // Appeler ici ta fonction de rendu de la grille (renderSchedule)
            console.log("Planning chargé:", schedule);
        } catch (err) {
            console.error("Erreur planning:", err);
        }
    }

    // Gestion de la déconnexion
    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'login.html';
    });

    // Lancement au chargement
    window.onload = loadUserProfile;
</script>
</body>
