<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSched | Teacher Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" href="css/global.css">
    <style>
        :root { --sidebar-width: 280px; }
        body { background-color: var(--bg-light); display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: linear-gradient(180deg, var(--primary) 0%, #051b17 100%); color: white; padding: 2rem 1.5rem; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
        .main-content { margin-left: var(--sidebar-width); flex-grow: 1; padding: 2.5rem; max-width: calc(100vw - var(--sidebar-width)); }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.875rem 1.25rem; border-radius: 0.75rem; transition: all 0.2s; color: rgba(255, 255, 255, 0.7); font-weight: 500; }
        .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.1); color: white; }
        .nav-link.active { background: var(--primary-light); }
        .table-container { background: white; border-radius: 1.25rem; overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid rgba(0,0,0,0.05); }
        th { background: #f8fafc; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem 1.5rem; text-align: left; }
        td { padding: 1rem 1.5rem; border-top: 1px solid #f1f5f9; font-size: 0.875rem; color: #1e293b; }
    </style>
</head>
<body class="animate-fade-in">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="flex items-center gap-3 mb-10 px-2">
            <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-md border border-white/10">
                <span class="material-symbols-outlined text-white">school</span>
            </div>
            <div><h1 class="text-xl font-bold">UniSched</h1><p class="text-[10px] uppercase text-white/40">Admin Portal</p></div>
        </div>
        <nav class="space-y-2 flex-grow">
            <a href="admin-dashboard.html" class="nav-link"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></a>
            <a href="master-schedule.html" class="nav-link"><span class="material-symbols-outlined">calendar_month</span><span>Master Schedule</span></a>
            <a href="admin-rooms.html" class="nav-link"><span class="material-symbols-outlined">meeting_room</span><span>Rooms</span></a>
            <a href="admin-teachers.html" class="nav-link active"><span class="material-symbols-outlined">group</span><span>Teachers</span></a>
            <a href="teaching-units.html" class="nav-link"><span class="material-symbols-outlined">menu_book</span><span>Teaching Units</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="flex justify-between items-center mb-10">
            <div><h2 class="text-3xl font-bold text-gray-900 tracking-tight">Faculty Management</h2><p class="text-gray-500 mt-1">Manage teacher records and department assignments.</p></div>
            <button id="add-teacher-btn" class="bg-primary px-5 py-2.5 rounded-xl text-white font-bold shadow-lg flex items-center gap-2">
                <span class="material-symbols-outlined">person_add</span><span>Add New Teacher</span>
            </button>
        </header>

        <div class="table-container">
            <table class="w-full">
                <thead><tr><th>Name</th><th>Email</th><th>Preferences</th><th>Actions</th></tr></thead>
                <tbody id="teachers-tbody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { api } from './js/api.js';
        const loadTeachers = async () => {
            const teachers = await api.get('/admin/enseignants');
            const tbody = document.getElementById('teachers-tbody');
            tbody.innerHTML = teachers.map(t => `
                <tr>
                    <td class="font-bold">${t.nom}</td>
                    <td>${t.email}</td>
                    <td><span class="text-xs text-gray-400">Not submitted</span></td>
                    <td><button class="text-gray-400 hover:text-primary transition-colors"><span class="material-symbols-outlined">edit</span></button></td>
                </tr>
            `).join('');
        };
        loadTeachers();
    </script>
</body>
</html>
