<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSched | Teacher Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #0a483a, #051b17, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            position: relative;
            z-index: 10;
        }
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            z-index: 0;
        }
        .login-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(120px);
            opacity: 0.2;
            z-index: -1;
        }
    </style>
</head>
<body class="animate-fade-in">
    <div class="bg-pattern"></div>
    <div class="login-glow"></div>

    <div class="login-card glass-card">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-yellow-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Teacher Portal</h1>
            <p class="text-gray-400 mt-2">Access your schedule and preferences</p>
        </div>

        <form id="teacher-login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all placeholder-gray-500"
                    placeholder="teacher@univ.edu">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all placeholder-gray-500"
                    placeholder="••••••••">
            </div>
            
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-400">
                    <input type="checkbox" class="rounded border-white/10 bg-white/5 text-yellow-500 mr-2">
                    Remember me
                </label>
                <a href="#" class="text-yellow-500 hover:underline">Forgot password?</a>
            </div>

            <button type="submit" 
                class="w-full py-4 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                Sign In to Portal
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-gray-500 space-y-4">
            <p>
                Not a teacher? <a href="admin-login.html" class="text-primary-light font-semibold hover:underline">Admin Login</a>
            </p>
            <p>
                Don't have an account? <a href="register.html" class="text-primary-light font-semibold hover:underline">Register here</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api.js';

        document.getElementById('teacher-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const data = await api.post('/auth/login', { email, password });
                if (data.user.role !== 'ENSEIGNANT') {
                    throw new Error('Unauthorized role. This portal is for teachers only.');
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'teacher-schedule.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
