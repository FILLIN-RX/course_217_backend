<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSched | Master Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" href="css/global.css">
    <style>
        :root { --sidebar-width: 280px; }
        body { background-color: var(--bg-light); display: flex; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: linear-gradient(180deg, var(--primary) 0%, #051b17 100%); color: white; padding: 2rem 1.5rem; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
        .main-content { margin-left: var(--sidebar-width); flex-grow: 1; padding: 2.5rem; max-width: calc(100vw - var(--sidebar-width)); }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.875rem 1.25rem; border-radius: 0.75rem; transition: all 0.2s; color: rgba(255, 255, 255, 0.7); font-weight: 500; }
        .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.1); color: white; }
        .nav-link.active { background: var(--primary-light); }
        
        .schedule {
            display: grid;
            grid-template-columns: 80px repeat(6, 1fr);
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .day-column { display: flex; flex-direction: column; gap: 1rem; }
        .ue-block {
            background: white;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--primary);
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .ue-block:hover { transform: scale(1.02); box-shadow: var(--shadow-lg); }
        .time-header { font-weight: 800; font-size: 0.75rem; color: #64748b; text-transform: uppercase; text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body class="animate-fade-in">

    <!-- Sidebar -->
    <aside class="sidebar shadow-2xl">
        <div class="flex items-center gap-3 mb-10 px-2">
            <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-md border border-white/10">
                <span class="material-symbols-outlined text-white">school</span>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">UniSched</h1>
                <p class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Admin Portal</p>
            </div>
        </div>

        <nav class="space-y-2 flex-grow">
            <a href="admin-dashboard.html" class="nav-link">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a href="master-schedule.html" class="nav-link active">
                <span class="material-symbols-outlined">calendar_month</span>
                <span>Master Schedule</span>
            </a>
            <a href="admin-rooms.html" class="nav-link">
                <span class="material-symbols-outlined">meeting_room</span>
                <span>Rooms</span>
            </a>
            <a href="admin-teachers.html" class="nav-link">
                <span class="material-symbols-outlined">group</span>
                <span>Teachers</span>
            </a>
            <a href="teaching-units.html" class="nav-link">
                <span class="material-symbols-outlined">menu_book</span>
                <span>Teaching Units</span>
            </a>
            <a href="validation-panel.html" class="nav-link">
                <span class="material-symbols-outlined">task_alt</span>
                <span>Validation</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Master Schedule</h2>
                <p class="text-gray-500 mt-1">Comprehensive view of all course allocations across the university.</p>
            </div>
            <div class="flex gap-4">
                <select id="filter-class" class="bg-white px-4 py-2 border border-gray-200 rounded-xl text-sm font-semibold">
                    <option value="">Filter by Class</option>
                </select>
                <button id="generate-btn" class="bg-primary px-6 py-3 rounded-xl text-white font-bold shadow-lg hover:bg-primary-light transition-all">
                    Generate Optimized Schedule
                </button>
            </div>
        </header>

        <div class="grid grid-cols-6 gap-6" id="schedule-view">
            <!-- Day labels -->
            <div class="time-header">Mon</div>
            <div class="time-header">Tue</div>
            <div class="time-header">Wed</div>
            <div class="time-header">Thu</div>
            <div class="time-header">Fri</div>
            <div class="time-header">Sat</div>

            <!-- Columns will be populated by JS -->
            <div id="col-Lundi" class="day-column"></div>
            <div id="col-Mardi" class="day-column"></div>
            <div id="col-Mercredi" class="day-column"></div>
            <div id="col-Jeudi" class="day-column"></div>
            <div id="col-Vendredi" class="day-column"></div>
            <div id="col-Samedi" class="day-column"></div>
        </div>
    </main>

    <script type="module">
        import { api } from './js/api.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const classes = await api.get('/admin/classes');
            const classSelect = document.getElementById('filter-class');
            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = c.nom;
                classSelect.appendChild(opt);
            });

            document.getElementById('generate-btn').addEventListener('click', async () => {
                const classeId = classSelect.value;
                if (!classeId) return alert("Please select a class first");
                
                try {
                    const res = await api.post('/admin/generer-emploi-du-temps', { classe_id: classeId, semestre_id: 1, annee_id: 1 });
                    alert(res.message);
                    window.location.reload();
                } catch (err) {
                    alert(err.message);
                }
            });
        });
    </script>
</body>
</html>
