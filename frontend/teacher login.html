<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Teacher Login Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#355f57",
                        "primary-hover": "#2a4d46",
                        "background-light": "#fafafa",
                        "background-dark": "#16181d",
                        "surface-light": "#ffffff",
                        "surface-dark": "#23262d",
                        "text-main": "#131615",
                        "text-secondary": "#6e7c7a",
                        "border-color": "#dfe2e2",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-4">
<!-- Decorative Subtle Background Pattern -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(#355f57 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- Login Container -->
<div class="relative w-full max-w-[480px] z-10">
<!-- Logo / Brand Area above card -->
<div class="mb-8 flex flex-col items-center text-center">
<div class="h-16 w-16 bg-primary/10 rounded-xl flex items-center justify-center mb-4 text-primary">
<span class="material-symbols-outlined text-4xl">school</span>
</div>
<h1 class="text-primary font-bold text-2xl tracking-tight">University Scholar System</h1>
</div>
<!-- Main Card -->
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-border-color dark:border-gray-800 overflow-hidden">
<!-- Hero Image Section inside card -->
<div class="w-full h-32 bg-center bg-cover relative" data-alt="Abstract geometric academic pattern in green and teal" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDkSk4GyptWF8aFeuLSvj7WeDHrwnQyuIUTttDU4lNVU9Ufx9o_pB6dGLLwRgDBgAcyAu59D_oE3cwYChz98CCWdqTXd46kU1Gh-kFGbnbhb1-wzdQtqxtRryxpY3wFZ1oQQahIQTr9edw1M02fUbxfTPVXmANLaOf1EXm2l_BeiyQJvYxwa3ManBfjSwrbWutnaEwKbaH6fH4i6HkA1jJVgbQ7wxPoXwdQyLVeYz10OGDuWRMC8qhHYwtZV_yAUUAtdCASEQYz0c4');">
<div class="absolute inset-0 bg-primary/80 mix-blend-multiply"></div>
<div class="absolute bottom-4 left-6 text-white z-10">
<h2 class="text-xl font-bold">Faculty Portal</h2>
<p class="text-white/80 text-xs mt-1 font-medium tracking-wide uppercase">Secure Access</p>
</div>
</div>
<div class="p-8 pt-6">
<!-- Greeting -->
<div class="mb-8">
<p class="text-text-secondary dark:text-gray-400 text-sm leading-relaxed">
                        Welcome back, Professor. Please enter your academic credentials to manage your schedule.
                    </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2 group">
<label class="text-text-main dark:text-gray-200 text-sm font-semibold flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-lg text-text-secondary">mail</span>
                            Email Address
                        </label>
<input class="form-input w-full rounded-lg border-border-color bg-background-light dark:bg-background-dark dark:border-gray-700 text-text-main dark:text-white px-4 py-3 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 placeholder:text-gray-400" id="email" placeholder="name@university.edu" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2 group">
<div class="flex justify-between items-center">
<label class="text-text-main dark:text-gray-200 text-sm font-semibold flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-lg text-text-secondary">lock</span>
                                Password
                            </label>
<a class="text-primary text-xs font-semibold hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="form-input w-full rounded-lg border-border-color bg-background-light dark:bg-background-dark dark:border-gray-700 text-text-main dark:text-white px-4 py-3 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 placeholder:text-gray-400" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center gap-2 mt-1">
<input class="w-4 h-4 text-primary bg-background-light border-gray-300 rounded focus:ring-primary dark:bg-gray-700 dark:border-gray-600" id="remember" type="checkbox"/>
<label class="text-sm text-text-secondary dark:text-gray-400" for="remember">Remember this device for 30 days</label>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary hover:bg-primary-hover text-white font-bold py-3.5 px-6 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 flex justify-center items-center gap-2 group" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<!-- SSO Option -->
<div class="bg-gray-50 dark:bg-black/20 p-4 text-center border-t border-border-color dark:border-gray-800">
<p class="text-xs text-text-secondary dark:text-gray-500 mb-3">Or sign in using</p>
<button class="inline-flex items-center justify-center gap-2 bg-white dark:bg-surface-dark border border-border-color dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-text-main dark:text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors w-full sm:w-auto">
<svg class="w-4 h-4" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Institutional Account
                </button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 flex justify-center gap-6 text-sm text-text-secondary dark:text-gray-500">
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
<span class="text-gray-300 dark:text-gray-700">|</span>
<a class="hover:text-primary transition-colors" href="#">IT Support</a>
<span class="text-gray-300 dark:text-gray-700">|</span>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
<p class="mt-4 text-center text-xs text-gray-400 dark:text-gray-600">
            © 2024 University Academic Systems. Secure connection.
        </p>
</div>
</body></html>
