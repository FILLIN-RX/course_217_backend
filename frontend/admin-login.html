<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniSched | Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global.css" />
    <style>
      body {
        background: radial-gradient(
          circle at top left,
          #0a483a,
          #051b17,
          #000000
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 3rem;
        position: relative;
        z-index: 10;
      }
      .bg-pattern {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        opacity: 0.1;
        z-index: 0;
      }
      .login-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        height: 300px;
        background: var(--primary);
        filter: blur(120px);
        opacity: 0.2;
        z-index: -1;
      }
    </style>
  </head>
  <body class="animate-fade-in">
    <div class="bg-pattern"></div>
    <div class="login-glow"></div>

    <div class="login-card glass-card">
      <div class="text-center mb-10">
        <div
          class="w-16 h-16 bg-primary dark:bg-primary-light rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-10 w-10 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"
            />
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight">
          Admin Console
        </h1>
        <p class="text-gray-400 mt-2">
          Secure access for university management
        </p>
      </div>

      <form id="admin-login-form" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all placeholder-gray-500"
            placeholder="admin@unischedule.edu"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all placeholder-gray-500"
            placeholder="••••••••"
          />
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-400">
            <input
              type="checkbox"
              class="rounded border-white/10 bg-white/5 text-primary mr-2"
            />
            Remember me
          </label>
          <a href="#" class="text-primary-light hover:underline"
            >Forgot password?</a
          >
        </div>

        <button
          type="submit"
          class="w-full py-4 bg-primary hover:bg-primary-light text-white font-bold rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]"
        >
          Sign In to Dashboard
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-sm text-gray-500">
          Are you a teacher?
          <a
            href="teacher-login.html"
            class="text-primary-light font-semibold hover:underline"
            >Go to Teacher Login</a
          >
        </p>
      </div>
    </div>

    <script type="module">
      import { api } from "./js/api.js";

      document
        .getElementById("admin-login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            const data = await api.post("/auth/login", { email, password });
            if (data.user.role !== "ADMIN") {
              throw new Error(
                "Unauthorized role. This portal is for admins only.",
              );
            }
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = "admin-dashboard.html";
          } catch (err) {
            alert(err.message);
          }
        });
    </script>
  </body>
</html>
