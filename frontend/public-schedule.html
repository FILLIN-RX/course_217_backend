<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>UniSched | Emploi du Temps par Classe</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,FILL@0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#355f57", "background-light": "#fafafa" },
                    fontFamily: { "display": ["Manrope", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        .course-card { transition: all 0.2s ease; z-index: 10; }
        .course-card:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid-line { border-bottom: 1px solid #e5e7eb; height: 60px; }
    </style>
</head>
<body class="bg-background-light font-display">

<main class="max-w-7xl mx-auto p-6">
    <div class="bg-white p-6 rounded-xl shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-end border border-gray-100">
        <div class="flex-1">
            <label class="block text-sm font-bold text-gray-700 mb-2">Choisir la Classe</label>
            <select id="select-classe" class="w-full border-gray-200 rounded-lg focus:ring-primary focus:border-primary">
                <option value="">Chargement...</option>
            </select>
        </div>
        <div class="w-48">
            <label class="block text-sm font-bold text-gray-700 mb-2">Semestre</label>
            <select id="select-semestre" class="w-full border-gray-200 rounded-lg">
                <option value="1">Semestre 1</option>
                <option value="2">Semestre 2</option>
            </select>
        </div>
        <button id="btn-charger" class="bg-primary text-white px-8 py-2.5 rounded-lg font-bold hover:opacity-90 transition-all flex items-center gap-2">
            <span class="material-symbols-outlined">search</span> Afficher
        </button>
    </div>

    <div id="calendar-view" class="hidden">
        <div class="grid grid-cols-7 bg-primary text-white rounded-t-xl overflow-hidden shadow-lg">
            <div class="p-4 text-center border-r border-white/10 font-bold text-xs uppercase">Heure</div>
            <div class="p-4 text-center border-r border-white/10 font-bold">Lundi</div>
            <div class="p-4 text-center border-r border-white/10 font-bold">Mardi</div>
            <div class="p-4 text-center border-r border-white/10 font-bold">Mercredi</div>
            <div class="p-4 text-center border-r border-white/10 font-bold">Jeudi</div>
            <div class="p-4 text-center border-r border-white/10 font-bold">Vendredi</div>
            <div class="p-4 text-center font-bold">Samedi</div>
        </div>

        <div class="relative bg-white border border-gray-200 rounded-b-xl shadow-sm overflow-hidden" style="height: 720px;">
            <div class="absolute inset-0">
                <div class="grid grid-cols-7 h-full">
                    <div class="border-r border-gray-100 bg-gray-50/50">
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">08:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">09:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">10:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">11:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">12:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">13:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">14:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">15:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">16:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">17:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">18:00</div>
                        <div class="grid-line flex items-center justify-center text-[10px] font-bold text-gray-400">19:00</div>
                    </div>
                    <div class="relative border-r border-gray-100" data-day="Lundi"></div>
                    <div class="relative border-r border-gray-100" data-day="Mardi"></div>
                    <div class="relative border-r border-gray-100" data-day="Mercredi"></div>
                    <div class="relative border-r border-gray-100" data-day="Jeudi"></div>
                    <div class="relative border-r border-gray-100" data-day="Vendredi"></div>
                    <div class="relative" data-day="Samedi"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    const API_URL = "http://localhost:4000";

    async function init() {
        // Charger les classes au démarrage
        try {
            const res = await fetch(`${API_URL}/public/classes`);
            const classes = await res.json();
            const select = document.getElementById('select-classe');
            select.innerHTML = '<option value="">Choisir une classe...</option>';
            classes.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.nom}</option>`;
            });
        } catch (e) { console.error("Erreur classes", e); }

        document.getElementById('btn-charger').addEventListener('click', chargerEmploiDuTemps);
    }

    async function chargerEmploiDuTemps() {
        const classeId = document.getElementById('select-classe').value;
        const semestreId = document.getElementById('select-semestre').value;
        if(!classeId) return alert("Sélectionnez une classe");

        document.getElementById('calendar-view').classList.remove('hidden');

        // Nettoyer la grille
        document.querySelectorAll('[data-day]').forEach(col => col.innerHTML = '');

        try {
            // Appel à l'API publique (ne renvoie que les cours VALIDÉS)
            const res = await fetch(`${API_URL}/public/schedule/${classeId}/${semestreId}`);
            const cours = await res.json();

            cours.forEach(c => {
                const col = document.querySelector(`[data-day="${c.jour}"]`);
                if(col) {
                    // Calcul position : (Heure début - 8) * 60px
                    const startH = parseInt(c.heure_debut.split(':')[0]);
                    const startM = parseInt(c.heure_debut.split(':')[1]);
                    const endH = parseInt(c.heure_fin.split(':')[0]);
                    const endM = parseInt(c.heure_fin.split(':')[1]);

                    const top = (startH - 8) * 60 + (startM);
                    const height = ((endH * 60 + endM) - (startH * 60 + startM));

                    const card = document.createElement('div');
                    card.className = "absolute left-1 right-1 course-card bg-primary/10 border-l-4 border-primary rounded-lg p-2 overflow-hidden shadow-sm";
                    card.style.top = `${top}px`;
                    card.style.height = `${height}px`;

                    card.innerHTML = `
                        <p class="text-[10px] font-bold text-primary uppercase">${c.ue_code}</p>
                        <p class="text-[11px] font-extrabold text-gray-900 leading-tight truncate">${c.ue_intitule}</p>
                        <div class="mt-2 flex flex-col gap-1">
                            <span class="flex items-center gap-1 text-[9px] text-gray-500 font-bold">
                                <span class="material-symbols-outlined text-[12px]">person</span> ${c.enseignant_nom || 'Prof à confirmer'}
                            </span>
                            <span class="flex items-center gap-1 text-[9px] text-gray-500 font-bold">
                                <span class="material-symbols-outlined text-[12px]">location_on</span> ${c.salle_nom || 'Salle ?'}
                            </span>
                        </div>
                    `;
                    col.appendChild(card);
                }
            });
        } catch (e) { alert("Erreur lors du chargement"); }
    }

    window.onload = init;
</script>
</body>
</html>
