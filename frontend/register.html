<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSched | Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #0a483a, #051b17, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem 0;
        }
        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 3rem;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="animate-fade-in">
    <div class="register-card glass-card">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-white tracking-tight">Create Account</h1>
            <p class="text-gray-400 mt-2">Join the University Scheduling System</p>
        </div>

        <form id="register-form" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                    <input type="text" id="nom" required 
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all placeholder-gray-500"
                        placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Role</label>
                    <select id="role" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all">
                        <option value="ENSEIGNANT" class="bg-bg-dark">Teacher</option>
                        <option value="ADMIN" class="bg-bg-dark">Administrator</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all placeholder-gray-500"
                    placeholder="john@univ.edu">
            </div>

            <div id="teacher-id-section">
                <label class="block text-sm font-medium text-gray-300 mb-2">Teacher ID (Optional if Admin)</label>
                <input type="number" id="enseignant_id" 
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all placeholder-gray-500"
                    placeholder="leave blank if not applicable">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-primary-light focus:border-transparent transition-all placeholder-gray-500"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-4 bg-primary hover:bg-primary-light text-white font-bold rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                Create My Account
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            Already have an account? <a href="teacher-login.html" class="text-primary-light font-semibold hover:underline">Sign In</a>
        </div>
    </div>

    <script type="module">
        import { api } from './js/api.js';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                nom: document.getElementById('nom').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                enseignant_id: document.getElementById('enseignant_id').value || null
            };

            try {
                await api.post('/auth/register', payload);
                alert('Account created successfully! Please sign in.');
                window.location.href = 'teacher-login.html';
            } catch (err) {
                alert(err.message);
            }
        });

        // Hide teacher ID if admin is selected
        document.getElementById('role').addEventListener('change', (e) => {
            const section = document.getElementById('teacher-id-section');
            section.style.display = e.target.value === 'ADMIN' ? 'none' : 'block';
        });
    </script>
</body>
</html>
